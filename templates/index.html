<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Угадай цифру — мини-демо</title>
    <style>
        body {
            font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px;
            background: #f6f8fb;
            color: #222;
        }

        .card {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 6px 24px rgba(20, 30, 60, 0.08);
            width: 360px;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 20px
        }

        p.lead {
            margin: 0 0 16px 0;
            color: #546170
        }

        canvas {
            background: #10121a;
            border-radius: 8px;
            display: block;
            margin: 8px auto;
            touch-action: none;
        }

        .controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        button {
            padding: 8px 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600
        }

        .btn-clear {
            background: #e7eefc
        }

        .btn-predict {
            background: #2b6ef6;
            color: white
        }

        .result {
            margin-top: 12px;
            font-size: 18px;
            text-align: center;
        }

        .small {
            font-size: 13px;
            color: #5b646f;
            margin-top: 6px
        }

        .top3 {
            margin-top: 8px;
            font-size: 14px;
            color: #333
        }

        .btn-feedback {
            background: #111827;
            color: white;
            margin-top: 10px;
            width: 100%;
        }

        .btn-feedback:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 1000;
        }

        .hidden {
            display: none;
        }

        .modal-content {
            background: white;
            border-radius: 14px;
            padding: 20px;
            width: 100%;
            max-width: 420px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .modal-content label {
            display: block;
            margin-top: 12px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .modal-content input[type="text"],
        .modal-content input[type="email"],
        .modal-content input[type="number"],
        .modal-content textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            border: 1px solid #cfd7e3;
            border-radius: 8px;
            font: inherit;
        }

        .radio-group {
            display: flex;
            gap: 18px;
            margin-top: 6px;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            border: none;
            background: transparent;
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Нарисуй цифру — я попробую угадать</h1>
        <p class="lead">Рисуй мышкой в рамке ниже. Нажми <b>Предсказать</b>, и мой внутренний ИИ скажет, что это.</p>

        <canvas id="draw" width="280" height="280"></canvas>

        <div class="controls">
            <button class="btn-clear" id="clearBtn">Очистить</button>
            <button class="btn-predict" id="predictBtn">Предсказать</button>
        </div>
        <div class="result" id="result">—</div>
        <div class="top3" id="top3"></div>
        <button class="btn-feedback" id="openFeedbackBtn" disabled>Оставить отзыв</button>
    </div>

    <div class="modal hidden" id="feedbackModal">
        <div class="modal-content">
            <button class="close-btn" id="closeFeedbackBtn" type="button">×</button>

            <h2>Обратная связь</h2>

            <form id="feedbackForm">
                <label for="fbName">Name</label>
                <input type="text" id="fbName" required>

                <label for="fbEmail">Email</label>
                <input type="email" id="fbEmail" required>

                <label>Был ли ответ нейросети правильным?</label>
                <div class="radio-group">
                    <label><input type="radio" name="isCorrect" value="yes" required> Да</label>
                    <label><input type="radio" name="isCorrect" value="no"> Нет</label>
                </div>

                <div id="correctAnswerWrap" style="display:none;">
                    <label for="fbCorrectAnswer">Какой ответ был правильным?</label>
                    <input type="number" id="fbCorrectAnswer" min="0" max="9">
                </div>

                <label for="fbComment">Комментарий (необязательно)</label>
                <textarea id="fbComment" rows="4"></textarea>

                <div class="controls" style="margin-top: 16px;">
                    <button type="submit" class="btn-predict">Отправить</button>
                    <button type="button" class="btn-clear" id="cancelFeedbackBtn">Отмена</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        (function () {
            const canvas = document.getElementById("draw");
            const ctx = canvas.getContext("2d");
            const clearBtn = document.getElementById("clearBtn");
            const predictBtn = document.getElementById("predictBtn");
            const resultDiv = document.getElementById("result");
            const top3Div = document.getElementById("top3");

            let lastImageDataUrl = null;
            let lastPrediction = null;

            // Настройка холста: тёмный фон и белая кисть
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.lineWidth = 18;
            ctx.strokeStyle = "white";

            // простая логика рисования (pointer events)
            let drawing = false;
            let lastX = 0, lastY = 0;

            function ptrDown(e) {
                drawing = true;
                const r = canvas.getBoundingClientRect();
                lastX = (e.clientX || e.touches[0].clientX) - r.left;
                lastY = (e.clientY || e.touches[0].clientY) - r.top;
            }
            function ptrMove(e) {
                if (!drawing) return;
                e.preventDefault();
                const r = canvas.getBoundingClientRect();
                const x = (e.clientX || e.touches[0].clientX) - r.left;
                const y = (e.clientY || e.touches[0].clientY) - r.top;
                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                ctx.lineTo(x, y);
                ctx.stroke();
                lastX = x; lastY = y;
            }
            function ptrUp(e) { drawing = false; }

            // события
            canvas.addEventListener("pointerdown", (e) => { canvas.setPointerCapture(e.pointerId); ptrDown(e); });
            canvas.addEventListener("pointermove", ptrMove);
            canvas.addEventListener("pointerup", ptrUp);
            canvas.addEventListener("pointercancel", ptrUp);
            // Для мобильных браузеров, pointer events обычно покрывают touch/mouse.

            clearBtn.addEventListener("click", () => {
                ctx.fillStyle = "#10121a";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                resultDiv.textContent = "—";
                top3Div.textContent = "";
            });

            predictBtn.addEventListener("click", async () => {
                resultDiv.textContent = "Подождите... думает мой нейрончик 🧠";
                top3Div.textContent = "";
                // получить картинку в base64 (png)
                const dataUrl = canvas.toDataURL("image/png");

                try {
                    const res = await fetch("/predict", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ image: dataUrl })
                    });

                    const text = await res.text();

                    if (!res.ok) {
                        resultDiv.textContent = `Server error ${res.status}: ${text}`;
                        return;
                    }

                    const j = JSON.parse(text);
                    if (j.error) {
                        resultDiv.textContent = "Ошибка: " + j.error;
                        return;
                    }
                    const pred = j.pred;
                    resultDiv.innerHTML = `<b>Я думаю, это: ${pred}</b> 🥳`;

                    // топ-3
                    const top = j.top3 || [];
                    top3Div.innerHTML = "Топ-3: " + top.map(t => `${t.class} (${(t.prob * 100).toFixed(1)}%)`).join(", ");

                    lastImageDataUrl = dataUrl;
                    lastPrediction = j;
                    document.getElementById("openFeedbackBtn").disabled = false;

                } catch (err) {
                    resultDiv.textContent = "Сетевая ошибка — не могу связаться с сервером.";
                    console.error(err);
                }
            });

            const openFeedbackBtn = document.getElementById("openFeedbackBtn");
            const feedbackModal = document.getElementById("feedbackModal");
            const closeFeedbackBtn = document.getElementById("closeFeedbackBtn");
            const cancelFeedbackBtn = document.getElementById("cancelFeedbackBtn");
            const feedbackForm = document.getElementById("feedbackForm");
            const correctAnswerWrap = document.getElementById("correctAnswerWrap");
            const fbCorrectAnswer = document.getElementById("fbCorrectAnswer");

            openFeedbackBtn.addEventListener("click", () => {
                if (!lastPrediction) return;
                feedbackForm.reset();
                correctAnswerWrap.style.display = "none";
                fbCorrectAnswer.required = false;
                feedbackModal.classList.remove("hidden");
            });

            closeFeedbackBtn.addEventListener("click", () => {
                feedbackModal.classList.add("hidden");
            });

            cancelFeedbackBtn.addEventListener("click", () => {
                feedbackModal.classList.add("hidden");
            });

            document.querySelectorAll('input[name="isCorrect"]').forEach((el) => {
                el.addEventListener("change", () => {
                    const selected = document.querySelector('input[name="isCorrect"]:checked');
                    const isNo = selected && selected.value === "no";

                    correctAnswerWrap.style.display = isNo ? "block" : "none";
                    fbCorrectAnswer.required = isNo;
                });
            });

            feedbackForm.addEventListener("submit", async (e) => {
                e.preventDefault();

                const selected = document.querySelector('input[name="isCorrect"]:checked');
                if (!selected) {
                    alert("Please select Yes or No.");
                    return;
                }

                const isCorrect = selected.value === "yes";

                const payload = {
                    name: document.getElementById("fbName").value.trim(),
                    email: document.getElementById("fbEmail").value.trim(),
                    is_correct: isCorrect,
                    correct_answer: isCorrect ? null : document.getElementById("fbCorrectAnswer").value.trim(),
                    comment: document.getElementById("fbComment").value.trim(),
                    image_data_url: lastImageDataUrl,
                    pred: lastPrediction.pred,
                    probs: lastPrediction.probs,
                    top3: lastPrediction.top3
                };

                try {
                    const res = await fetch("/feedback", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    const text = await res.text();

                    if (!res.ok) {
                        console.log("Ошибка сервера: " + text);
                        return;
                    }

                    const j = JSON.parse(text);
                    if (j.ok) {
                        alert("Спасибо! Отзыв сохранён.");
                        feedbackModal.classList.add("hidden");
                    } else {
                        console.log("Ошибка: " + (j.error || "unknown"));
                    }
                } catch (err) {
                    console.error(err);
                    alert("Не удалось отправить отзыв.");
                }
            });

        })();
    </script>
</body>

</html>
